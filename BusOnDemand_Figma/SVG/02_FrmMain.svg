<text id="text-12" class="ui-text" x="62" y="226" font-size="22px" font-weight="700" fill="#17345B" text-anchor="start">Xin chào, Điều phối viên</text>
<text id="text-13" class="ui-text" x="62" y="254" font-size="13px" font-weight="400" fill="#64758B" text-anchor="start">Từ đây có thể xem đề xuất chuyến, điều chỉnh lịch trình và quản lý cấu hình hệ thống.</text>
