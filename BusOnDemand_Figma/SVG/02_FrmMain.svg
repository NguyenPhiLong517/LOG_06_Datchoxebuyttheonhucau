<text id="text-9" class="ui-text" x="38" y="132" font-size="30px" font-weight="700" fill="#17345B" text-anchor="start">Trang chủ</text>
<text id="text-10" class="ui-text" x="40" y="157" font-size="13px" font-weight="400" fill="#64758B" text-anchor="start">Chọn chức năng theo nghiệp vụ và vai trò đã đăng nhập.</text>
