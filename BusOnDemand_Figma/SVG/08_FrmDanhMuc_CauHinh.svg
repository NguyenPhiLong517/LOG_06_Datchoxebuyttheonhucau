<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">FrmDanhMuc - Tab cau hinh he thong</title><desc id="desc">Editable desktop UI mockup for Bus On Demand.</desc>
<defs><style>.ui-text{font-family:Inter,"Segoe UI",Arial,sans-serif}.no-select{user-select:none}</style></defs>
<rect id="shape-1" x="0" y="0" width="1440" height="900" rx="0" fill="#F3F6FB" stroke="none" stroke-width="1"/>
<rect id="shape-2" x="0" y="0" width="1440" height="82" rx="0" fill="#17345B" stroke="none" stroke-width="1"/>
<rect id="shape-3" x="28" y="17" width="48" height="48" rx="12" fill="#0D8C8C" stroke="none" stroke-width="1"/>
<text id="text-4" class="ui-text" x="52" y="49" font-size="26px" font-weight="700" fill="#FFFFFF" text-anchor="middle">B</text>
<text id="text-5" class="ui-text" x="91" y="35" font-size="17px" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing=".7">BUS ON DEMAND</text>
<text id="text-6" class="ui-text" x="92" y="56" font-size="9px" font-weight="700" fill="#C8D7E8" text-anchor="start" letter-spacing=".6">HỆ THỐNG ĐẶT CHỖ XE BUÝT THEO NHU CẦU</text>
<rect id="shape-7" x="1213.8" y="19" width="196.2" height="42" rx="21" fill="#24496F" stroke="none" stroke-width="1"/>
<text id="text-8" class="ui-text" x="1311.9" y="45" font-size="12px" font-weight="700" fill="#FFFFFF" text-anchor="middle">ĐIỀU PHỐI VIÊN · nd03</text>
<text id="text-9" class="ui-text" x="38" y="132" font-size="30px" font-weight="700" fill="#17345B" text-anchor="start">Danh mục xe và cấu hình hệ thống</text>
<text id="text-10" class="ui-text" x="40" y="157" font-size="13px" font-weight="400" fill="#64758B" text-anchor="start">Các ngưỡng nghiệp vụ được đọc từ cấu hình, cho phép điều phối viên điều chỉnh.</text>
<rect id="shape-11" x="1240" y="119" width="87.7" height="27" rx="13" fill="#E7F7F5" stroke="none" stroke-width="1"/>
<text id="text-12" class="ui-text" x="1283.85" y="137" font-size="11px" font-weight="700" fill="#0D8C8C" text-anchor="middle">UC16–UC17</text>
<rect id="shape-13" x="36" y="182" width="1368" height="642" rx="13" fill="#FFFFFF" stroke="#D9E3EF" stroke-width="1"/>
<text id="text-14" class="ui-text" x="58" y="212" font-size="18px" font-weight="700" fill="#17345B" text-anchor="start">Cấu hình ngưỡng</text>
<rect id="shape-15" x="58" y="205" width="210" height="38" rx="7" fill="#FFFFFF" stroke="#D9E3EF" stroke-width="1"/>
<text id="text-16" class="ui-text" x="163" y="229" font-size="12px" font-weight="700" fill="#64758B" text-anchor="middle">DANH MỤC XE</text>
<rect id="shape-17" x="276" y="205" width="220" height="38" rx="7" fill="#0D8C8C" stroke="none" stroke-width="1"/>
<text id="text-18" class="ui-text" x="386" y="229" font-size="12px" font-weight="700" fill="#FFFFFF" text-anchor="middle">CẤU HÌNH NGƯỠNG</text>
<line id="line-19" x1="58" y1="253" x2="1382" y2="253" stroke="#D9E3EF" stroke-width="1"/>
<text id="text-20" class="ui-text" x="60" y="286" font-size="12px" font-weight="400" fill="#64758B" text-anchor="start">Chọn ô “Giá trị” để chỉnh tham số. Tên và mô tả tham số không thay đổi.</text>
<rect id="shape-21" x="58" y="322" width="1324" height="43" rx="7" fill="#24496F" stroke="none" stroke-width="1"/>
<text id="text-22" class="ui-text" x="70" y="349" font-size="11px" font-weight="700" fill="#FFFFFF" text-anchor="start">Tên tham số</text>
<text id="text-23" class="ui-text" x="400" y="349" font-size="11px" font-weight="700" fill="#FFFFFF" text-anchor="start">Giá trị</text>
<text id="text-24" class="ui-text" x="550" y="349" font-size="11px" font-weight="700" fill="#FFFFFF" text-anchor="start">Mô tả</text>
<rect id="shape-25" x="58" y="365" width="1324" height="50" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1"/>
<line id="line-26" x1="58" y1="415" x2="1382" y2="415" stroke="#E8EDF4" stroke-width="1"/>
<text id="text-27" class="ui-text" x="70" y="394.0" font-size="11.5px" font-weight="700" fill="#1C2D43" text-anchor="start">NGUONG_GOM_NHOM</text>
<text id="text-28" class="ui-text" x="400" y="394.0" font-size="11.5px" font-weight="400" fill="#1C2D43" text-anchor="start">4</text>
<text id="text-29" class="ui-text" x="550" y="394.0" font-size="11.5px" font-weight="400" fill="#1C2D43" text-anchor="start">Số nhu cầu tối thiểu để tạo nhóm</text>
<rect id="shape-30" x="58" y="415" width="1324" height="50" rx="0" fill="#F7F9FC" stroke="none" stroke-width="1"/>
<line id="line-31" x1="58" y1="465" x2="1382" y2="465" stroke="#E8EDF4" stroke-width="1"/>
<text id="text-32" class="ui-text" x="70" y="444.0" font-size="11.5px" font-weight="700" fill="#1C2D43" text-anchor="start">DO_RONG_KHUNG_GIO_PHUT</text>
<text id="text-33" class="ui-text" x="400" y="444.0" font-size="11.5px" font-weight="400" fill="#1C2D43" text-anchor="start">30</text>
<text id="text-34" class="ui-text" x="550" y="444.0" font-size="11.5px" font-weight="400" fill="#1C2D43" text-anchor="start">Độ rộng khung giờ tính bằng phút</text>
<rect id="shape-35" x="58" y="465" width="1324" height="50" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1"/>
<line id="line-36" x1="58" y1="515" x2="1382" y2="515" stroke="#E8EDF4" stroke-width="1"/>
<text id="text-37" class="ui-text" x="70" y="494.0" font-size="11.5px" font-weight="700" fill="#1C2D43" text-anchor="start">HAN_HUY_GIO</text>
<text id="text-38" class="ui-text" x="400" y="494.0" font-size="11.5px" font-weight="400" fill="#1C2D43" text-anchor="start">2</text>
<text id="text-39" class="ui-text" x="550" y="494.0" font-size="11.5px" font-weight="400" fill="#1C2D43" text-anchor="start">Hủy muộn khi còn dưới số giờ này</text>
<rect id="shape-40" x="58" y="515" width="1324" height="50" rx="0" fill="#F7F9FC" stroke="none" stroke-width="1"/>
<line id="line-41" x1="58" y1="565" x2="1382" y2="565" stroke="#E8EDF4" stroke-width="1"/>
<text id="text-42" class="ui-text" x="70" y="544.0" font-size="11.5px" font-weight="700" fill="#1C2D43" text-anchor="start">NGUONG_NO_SHOW</text>
<text id="text-43" class="ui-text" x="400" y="544.0" font-size="11.5px" font-weight="400" fill="#1C2D43" text-anchor="start">3</text>
<text id="text-44" class="ui-text" x="550" y="544.0" font-size="11.5px" font-weight="400" fill="#1C2D43" text-anchor="start">Số vi phạm trong cửa sổ 30 ngày</text>
<rect id="shape-45" x="58" y="565" width="1324" height="50" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1"/>
<line id="line-46" x1="58" y1="615" x2="1382" y2="615" stroke="#E8EDF4" stroke-width="1"/>
<text id="text-47" class="ui-text" x="70" y="594.0" font-size="11.5px" font-weight="700" fill="#1C2D43" text-anchor="start">SO_NGAY_HAN_CHE</text>
<text id="text-48" class="ui-text" x="400" y="594.0" font-size="11.5px" font-weight="400" fill="#1C2D43" text-anchor="start">14</text>
<text id="text-49" class="ui-text" x="550" y="594.0" font-size="11.5px" font-weight="400" fill="#1C2D43" text-anchor="start">Số ngày hạn chế quyền đặt chỗ</text>
<rect id="shape-50" x="58" y="615" width="1324" height="50" rx="0" fill="#F7F9FC" stroke="none" stroke-width="1"/>
<line id="line-51" x1="58" y1="665" x2="1382" y2="665" stroke="#E8EDF4" stroke-width="1"/>
<text id="text-52" class="ui-text" x="70" y="644.0" font-size="11.5px" font-weight="700" fill="#1C2D43" text-anchor="start">CHU_KY_JOB_PHUT</text>
<text id="text-53" class="ui-text" x="400" y="644.0" font-size="11.5px" font-weight="400" fill="#1C2D43" text-anchor="start">15</text>
<text id="text-54" class="ui-text" x="550" y="644.0" font-size="11.5px" font-weight="400" fill="#1C2D43" text-anchor="start">Chu kỳ chạy tác vụ gom nhóm (mặc định triển khai)</text>
<rect id="shape-55" x="58" y="665" width="1324" height="50" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1"/>
<line id="line-56" x1="58" y1="715" x2="1382" y2="715" stroke="#E8EDF4" stroke-width="1"/>
<text id="text-57" class="ui-text" x="70" y="694.0" font-size="11.5px" font-weight="700" fill="#1C2D43" text-anchor="start">SO_NGAY_DONG_NHOM</text>
<text id="text-58" class="ui-text" x="400" y="694.0" font-size="11.5px" font-weight="400" fill="#1C2D43" text-anchor="start">3</text>
<text id="text-59" class="ui-text" x="550" y="694.0" font-size="11.5px" font-weight="400" fill="#1C2D43" text-anchor="start">Số ngày đóng nhóm (mặc định triển khai)</text>
<rect id="button-60" x="58" y="710" width="190" height="42" rx="8" fill="#0D8C8C" stroke="#0D8C8C" stroke-width="1"/>
<text id="text-61" class="ui-text" x="153.0" y="736.0" font-size="13px" font-weight="700" fill="#FFFFFF" text-anchor="middle">LƯU CẤU HÌNH</text>
<text id="text-62" class="ui-text" x="270" y="736" font-size="11px" font-weight="400" fill="#64758B" text-anchor="start">Giá trị số nguyên dương; 15 phút và 3 ngày là giá trị mặc định triển khai.</text>
</svg>